# replace "example.org" and "org.example"
## assumes common HTML for the CSP such as inline scripts, inline styles and fonts from Google
## TLSv1.3 requires OpenSSL 1.1.1+ (11 September 2018)
### (Partial) source: https://gist.github.com/plentz/6737338
### (Partial) source: https://report-uri.com/home/generate
### (Partial) source: https://securityheaders.com
### (Partial) source: https://www.ssllabs.com/ssltest/index.html
### (Partial) source: https://ssl-config.mozilla.org/#server=nginx&config=modern

server_tokens off;

server {
  access_log /var/log/nginx/org.example.access.log;
  
  server_name example.org www.example.org;
  listen 80;
  
  return 301 https://$server_name$request_uri;
}

server {
  access_log /var/log/nginx/org.example.access.log;
  
  server_name example.org www.example.org;
  listen 443 ssl http2;
  listen 443 quic reuseport;
  add_header Alt-Svc 'h3=":443"; ma=86400' always;

  location / {
    root /var/www/org.example/;
    index index.html index.htm index.php;
    try_files $uri $uri/ /index.php?q=$uri&$args;
  }

  location ~ \.php$ {
    include /etc/nginx/fastcgi_params;
    fastcgi_pass php-fpm;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME /var/www/org.example$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_script_name;
  }

  add_header Strict-Transport-Security "max-age=15768000;includeSubDomains; preload" always;
  add_header X-XSS-Protection "1; mode=block";
  add_header X-Frame-Options "DENY";
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' unsafe-inline; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.googleapis.com fonts.gstatic.com";
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  proxy_hide_header X-Powered-By;

  ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/example.org/chain.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers on;
  ssl_dhparam dh4096.pem;
  ssl_stapling on;
  ssl_stapling_verify on;
}
